name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Configure
        run: >-
          /usr/bin/cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DAPICORE=ON
          -DETHASHCL=OFF
          -DETHASHCUDA=OFF
          -DETHASHCPU=ON
          -DETHDBUS=OFF
          -DHUNTER_JOBS_NUMBER=2

      - name: Build
        run: /usr/bin/cmake --build build --parallel 2

      - name: Test
        run: /usr/bin/ctest --test-dir build --output-on-failure --timeout 60

  gpu-build:
    name: GPU backends
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: nvidia/cuda:11.8.0-devel-ubuntu22.04

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cmake git ninja-build perl \
            mesa-common-dev libglu1-mesa-dev freeglut3-dev

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Configure
        run: >-
          /usr/bin/cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DAPICORE=OFF
          -DETHASHCL=ON
          -DETHASHCUDA=ON
          -DETHASHCPU=OFF
          -DETHDBUS=OFF
          -DHUNTER_JOBS_NUMBER=2
          -DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda

      - name: Build
        run: /usr/bin/cmake --build build --target firominer --parallel 2
