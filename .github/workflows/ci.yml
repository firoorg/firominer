name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['OFF', 'address,undefined', thread]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install pinned build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build

      - name: Configure
        run: >-
          /usr/bin/cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSANITIZE=${{ matrix.sanitizer }}
          -DBUILD_TESTING=ON
          -DAPICORE=ON
          -DETHASHCL=OFF
          -DETHASHCUDA=OFF
          -DETHASHCPU=ON
          -DETHDBUS=OFF
          -DHUNTER_JOBS_NUMBER=2

      - name: Build
        run: /usr/bin/cmake --build build --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: /usr/bin/ctest --test-dir build --output-on-failure --timeout 300

  gpu-build:
    name: GPU backends
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: nvidia/cuda:11.8.0-devel-ubuntu22.04@sha256:94fd755736cb58979173d491504f0b573247b1745250249415b07fefc738e41f

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cmake git ninja-build perl \
            mesa-common-dev libglu1-mesa-dev freeglut3-dev

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Prepare reproducible build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          epoch="$(git log -1 --format=%ct)"
          test -n "$epoch"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          /usr/bin/cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DAPICORE=ON
          -DETHASHCL=ON
          -DETHASHCUDA=ON
          -DETHASHCPU=OFF
          -DETHDBUS=OFF
          -DHUNTER_JOBS_NUMBER=2
          -DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda

      - name: Build
        run: /usr/bin/cmake --build build --target firominer --parallel 2

      - name: Package binary
        run: |
          tar --format=ustar --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner --mode=0755 \
            -cf firominer-linux-x86_64-cuda11.8-opencl.tar \
            -C build/firominer firominer
          gzip -n firominer-linux-x86_64-cuda11.8-opencl.tar
          sha256sum firominer-linux-x86_64-cuda11.8-opencl.tar.gz

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: firominer-linux-x86_64-cuda11.8-opencl.tar.gz
          if-no-files-found: error
          archive: false

  windows-build:
    name: Windows GPU backends
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # Boost 1.76 predates VS 2022, but the runner includes its v142 toolset.
      VS160COMNTOOLS: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install CUDA
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'cuda-11.8.exe'
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/11.8.0/network_installers/cuda_11.8.0_windows_network.exe -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '8A19C2BFE33ECABCFCD9D776FABC8D1596FC1BF3A2565243C30BADCA3A4BDE5B') {
            throw 'CUDA installer checksum mismatch'
          }
          $process = Start-Process $installer -ArgumentList '-s','-n','nvcc_11.8','cudart_11.8','nvrtc_11.8','nvrtc_dev_11.8' -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) {
            throw "CUDA installer failed with exit code $($process.ExitCode)"
          }
          $cuda = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.8'
          if (!(Test-Path "$cuda\bin\nvcc.exe")) { throw 'nvcc missing after CUDA installation' }
          '@call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" %* -vcvars_ver=14.29' |
            Set-Content "$env:RUNNER_TEMP\vcvars142.bat" -Encoding ascii
          "CUDA_PATH=$cuda" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$cuda\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & "$cuda\bin\nvcc.exe" --version

      - name: Configure Windows builds
        shell: cmd
        run: |
          rem Build dependencies with the same v142 runtime used by firominer and CUDA.
          call "%RUNNER_TEMP%\vcvars142.bat" amd64 || exit /b 1
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v142 ^
            -DBUILD_TESTING=OFF ^
            -DAPICORE=ON ^
            -DETHASHCL=ON ^
            -DETHASHCUDA=ON ^
            -DETHASHCPU=OFF ^
            -DETHDBUS=OFF ^
            -DHUNTER_JOBS_NUMBER=2 ^
            -DHUNTER_MSVC_VCVARSALL:FILEPATH="%RUNNER_TEMP%\vcvars142.bat" ^
            -DCUDA_USE_STATIC_CUDA_RUNTIME=OFF ^
            -DCUDA_TOOLKIT_ROOT_DIR="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v11.8" || exit /b 1
          cmake -S . -B build-opencl -G "Visual Studio 17 2022" -A x64 -T v142 ^
            -DBUILD_TESTING=OFF ^
            -DAPICORE=ON ^
            -DETHASHCL=ON ^
            -DETHASHCUDA=OFF ^
            -DETHASHCPU=OFF ^
            -DETHDBUS=OFF ^
            -DHUNTER_JOBS_NUMBER=2 ^
            -DHUNTER_MSVC_VCVARSALL:FILEPATH="%RUNNER_TEMP%\vcvars142.bat" || exit /b 1

      - name: Build
        shell: cmd
        run: |
          rem CUDA 11.8 and its dependencies must use the same v142 environment.
          call "%RUNNER_TEMP%\vcvars142.bat" amd64 || exit /b 1
          cmake --build build --config Release --target firominer --parallel 2 || exit /b 1
          cmake --build build-opencl --config Release --target firominer --parallel 2 || exit /b 1

      - name: Package binary
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --install build --config Release --prefix stage-cuda-opencl
          cmake --install build-opencl --config Release --prefix stage-opencl
          Copy-Item "$env:CUDA_PATH\bin\cudart64_*.dll" stage-cuda-opencl\bin -ErrorAction Stop
          Copy-Item "$env:CUDA_PATH\bin\nvrtc*.dll" stage-cuda-opencl\bin -ErrorAction Stop
          if (!(Test-Path stage-cuda-opencl\bin\firominer.exe) -or !(Test-Path stage-opencl\bin\firominer.exe)) {
            throw 'firominer.exe missing from package'
          }
          7z a -tzip -mx=9 -mtc=off -mta=off -mtm=off firominer-windows-x86_64-cuda11.8-opencl.zip .\stage-cuda-opencl\*
          7z a -tzip -mx=9 -mtc=off -mta=off -mtm=off firominer-windows-x86_64-opencl.zip .\stage-opencl\*
          Get-FileHash firominer-windows-x86_64-cuda11.8-opencl.zip -Algorithm SHA256
          Get-FileHash firominer-windows-x86_64-opencl.zip -Algorithm SHA256

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: firominer-windows-x86_64-cuda11.8-opencl.zip
          if-no-files-found: error
          archive: false

      - name: Upload OpenCL binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: firominer-windows-x86_64-opencl.zip
          if-no-files-found: error
          archive: false
