name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install pinned build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build

      - name: Configure
        run: >-
          /usr/bin/cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DAPICORE=ON
          -DETHASHCL=OFF
          -DETHASHCUDA=OFF
          -DETHASHCPU=ON
          -DETHDBUS=OFF
          -DHUNTER_JOBS_NUMBER=2

      - name: Build
        run: /usr/bin/cmake --build build --parallel 2

      - name: Test
        run: /usr/bin/ctest --test-dir build --output-on-failure --timeout 60

  gpu-build:
    name: GPU backends
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: nvidia/cuda:11.8.0-devel-ubuntu22.04@sha256:94fd755736cb58979173d491504f0b573247b1745250249415b07fefc738e41f

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cmake git ninja-build perl \
            mesa-common-dev libglu1-mesa-dev freeglut3-dev

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Prepare reproducible build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          epoch="$(git log -1 --format=%ct)"
          test -n "$epoch"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          /usr/bin/cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DAPICORE=OFF
          -DETHASHCL=ON
          -DETHASHCUDA=ON
          -DETHASHCPU=OFF
          -DETHDBUS=OFF
          -DHUNTER_JOBS_NUMBER=2
          -DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda

      - name: Build
        run: /usr/bin/cmake --build build --target firominer --parallel 2

      - name: Package binary
        run: |
          tar --format=ustar --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner --mode=0755 \
            -cf firominer-linux-x86_64-cuda11.8-opencl.tar \
            -C build/firominer firominer
          gzip -n firominer-linux-x86_64-cuda11.8-opencl.tar
          sha256sum firominer-linux-x86_64-cuda11.8-opencl.tar.gz

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: firominer-linux-x86_64-cuda11.8-opencl.tar.gz
          if-no-files-found: error
          archive: false
