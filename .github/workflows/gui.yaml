name: GUI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Qt Widgets (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build qt6-base-dev qt6-qpa-plugins

      - name: Configure and build
        run: |
          cmake -S gui -B build-gui -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-gui --parallel 2

      - name: Test
        run: ctest --test-dir build-gui --output-on-failure

  windows:
    name: Qt Widgets (Windows)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt build tools
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --archives qtbase qttools --outputdir "$env:RUNNER_TEMP/Qt"
          "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "QT_ROOT=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and build
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S gui -B build-gui -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT" -DBUILD_TESTING=ON
          cmake --build build-gui --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build-gui --build-config Release --output-on-failure

      - name: Verify deployment
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --install build-gui --config Release --prefix stage-gui
          foreach ($file in @('firominer-gui.exe', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Network.dll', 'platforms/qwindows.dll', 'imageformats/qico.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (!(Test-Path "stage-gui/bin/$file")) { throw "$file missing from deployed GUI" }
          }
          foreach ($library in Get-ChildItem stage-gui/bin/Qt6*.dll) {
            if ($library.Name -notin @('Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Network.dll')) {
              throw "Unexpected Qt module $($library.Name): include its corresponding source before distributing"
            }
          }
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:QT_PLUGIN_PATH = "$PWD/stage-gui/bin"
          $env:QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES = '1'
          $process = Start-Process -FilePath "$PWD/stage-gui/bin/firominer-gui.exe" -ArgumentList '--version' -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(10000)) {
            $process.Kill()
            throw 'Deployed GUI did not exit after --version'
          }
          if ($process.ExitCode -ne 0) { throw "Deployed GUI exited with $($process.ExitCode)" }

      - name: Package launcher and corresponding source
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory stage-gui/sources | Out-Null
          Copy-Item docs/GUI.md stage-gui/README.md
          Copy-Item "$env:QT_ROOT/mkspecs/qconfig.pri" stage-gui/sources/qt-build-config.pri
          git archive --format=tar.gz --output=stage-gui/sources/firominer-source.tar.gz HEAD
          $qtSource = 'qtbase-everywhere-src-6.8.3.tar.xz'
          $qtSourceUrl = "https://download.qt.io/archive/qt/6.8/6.8.3/submodules/$qtSource"
          Invoke-WebRequest $qtSourceUrl -OutFile "stage-gui/sources/$qtSource"
          $qtSourceHash = '56001b905601bb9023d399f3ba780d7fa940f3e4861e496a7c490331f49e0b80'
          if ((Get-FileHash "stage-gui/sources/$qtSource" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $qtSourceHash) {
            throw 'Qt corresponding source checksum mismatch'
          }
          @(
            "Firominer commit: $(git rev-parse HEAD)"
            'Companion launcher only: obtain the Windows miner artifact from the CI workflow for this same commit.'
            'Qt: 6.8.3, official win64_msvc2022_64 binaries; no local Qt modifications'
            'Qt feature/compiler configuration: qt-build-config.pri'
            "Qt corresponding source: $qtSource"
            "Upstream source: $qtSourceUrl"
            'Qt Core, Gui, Widgets, Network and the deployed Qt plugins are built from qtbase.'
            'The qtbase archive also contains its bundled third-party source and license notices.'
            'Keep these source archives with the launcher when redistributing this package.'
          ) | Set-Content stage-gui/sources/README.txt -Encoding utf8
          $checksumLines = Get-ChildItem stage-gui -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relativePath = [IO.Path]::GetRelativePath("$PWD/stage-gui", $_.FullName).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relativePath"
          }
          $checksumLines | Set-Content stage-gui/SHA256SUMS.txt -Encoding utf8
          Compress-Archive -Path stage-gui/* -DestinationPath firominer-gui-windows-x64.zip

      - name: Upload Windows companion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: firominer-gui-windows-x64.zip
          if-no-files-found: error
          archive: false
