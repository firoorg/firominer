name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Core tests (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['OFF', 'address,undefined', thread]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install pinned build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build clang python3

      - name: Configure
        run: >-
          /usr/bin/cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSANITIZE=${{ matrix.sanitizer }}
          -DBUILD_TESTING=ON
          -DAPICORE=ON
          -DETHASHCL=OFF
          -DETHASHCUDA=OFF
          -DETHASHCPU=ON
          -DETHDBUS=OFF
          -DHUNTER_JOBS_NUMBER=2

      - name: Build
        run: /usr/bin/cmake --build build --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: /usr/bin/ctest --test-dir build --output-on-failure --timeout 300

  gpu-build:
    name: Linux (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: nvidia/cuda:12.9.2-devel-ubuntu22.04@sha256:e0203e3a0d3d02b05f4210867b973b7f48997c71bc99b994f2bd350ee60f77a1
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: cuda12.9-opencl
            cuda: 'ON'
            tests: 'OFF'
          - package: opencl
            cuda: 'OFF'
            tests: 'ON'
    env:
      PACKAGE: firominer-linux-x86_64-${{ matrix.package }}

    steps:
      - name: Install build tools
        run: |
          sed -n 's/^deb /deb-src /p' /etc/apt/sources.list > /etc/apt/sources.list.d/firominer-source.list
          apt-get update
          # Refresh image-provided GUI libraries whose old sources have left APT.
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cmake git ninja-build perl python3 \
            qt6-base-dev qt6-qpa-plugins libgl-dev patchelf xvfb xauth fonts-dejavu-core \
            libsystemd0 libuuid1 libgssapi-krb5-2 libkrb5-3 libk5crypto3 libkrb5support0

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Prepare reproducible build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          epoch="$(git log -1 --format=%ct)"
          test -n "$epoch"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          /usr/bin/cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON
          -DBUILD_TESTING=${{ matrix.tests }}
          -DAPICORE=ON
          -DETHASHCL=ON
          -DETHASHCUDA=${{ matrix.cuda }}
          -DETHASHCPU=ON
          -DETHDBUS=OFF
          -DHUNTER_JOBS_NUMBER=2
          -DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda
          -DCMAKE_INSTALL_LIBDIR=lib
          -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib'

      - name: Build
        run: /usr/bin/cmake --build build --parallel 2

      - name: Test Release build
        if: matrix.tests == 'ON'
        run: /usr/bin/ctest --test-dir build --output-on-failure --timeout 300

      - name: Build and test GUI
        run: |
          /usr/bin/cmake -S gui -B build-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          /usr/bin/cmake --build build-gui --parallel 2
          /usr/bin/ctest --test-dir build-gui --output-on-failure

      - name: Stage package
        run: |
          /usr/bin/cmake --install build --prefix "$PWD/stage"
          /usr/bin/cmake --install build-gui --prefix "$PWD/stage"
          /usr/bin/cmake "-DPACKAGE_DIR=$PWD/stage" \
            "-DQT_PLUGIN_DIR=$(qmake6 -query QT_INSTALL_PLUGINS)" -P cmake/DeployLinuxGui.cmake
          bash cmake/CollectLinuxGuiSources.sh "$PWD/stage"
          git archive --format=tar.gz --output=stage/sources/firominer-source.tar.gz HEAD
          cp LICENSE README.md stage/
          mkdir -p stage/docs
          cp docs/TESTING.md docs/API_DOCUMENTATION.md docs/GUI.md stage/docs/
          if [ '${{ matrix.cuda }}' = ON ]; then
            mkdir -p stage/lib
            cp -a /usr/local/cuda/lib64/libnvrtc.so* \
              /usr/local/cuda/lib64/libnvrtc-builtins.so* \
              /usr/local/cuda/lib64/libcudart.so* stage/lib/
            test -e stage/lib/libnvrtc.so.12
            test -e stage/lib/libnvrtc-builtins.so.12.9
          fi
          printf '%s\n' \
            "Source: https://github.com/$GITHUB_REPOSITORY/tree/$(git rev-parse HEAD)" \
            "Source commit: ${{ github.event.pull_request.head.sha || github.sha }}" \
            "Build: Release; CUDA=${{ matrix.cuda }}; OpenCL=ON; CPU=ON; API=ON; GUI=ON; DBUS=OFF" \
            "Host optimization: -O3; C/C++ IPO/LTO; generic x86-64" \
            "Platform: Linux x86-64, Ubuntu 22.04, CUDA toolkit 12.9.2" \
            "GUI: Qt $(qmake6 -query QT_VERSION); X11/XWayland; bundled Qt and supporting libraries" \
            "CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > stage/BUILD-INFO.txt
          cat stage/share/firominer/dependencies.txt >> stage/BUILD-INFO.txt
          (cd stage && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Package and verify
        run: |
          tar --sort=name --format=ustar --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            -cf "$PACKAGE.tar" -C stage .
          gzip -n "$PACKAGE.tar"
          sha256sum "$PACKAGE.tar.gz" > "$PACKAGE.tar.gz.sha256"
          mkdir 'unpacked Linux package'
          tar -xzf "$PACKAGE.tar.gz" -C 'unpacked Linux package'
          cd 'unpacked Linux package'
          sha256sum --check SHA256SUMS
          test -x bin/firominer-gui
          test -f bin/qt.conf
          test -f sources/firominer-source.tar.gz
          test -n "$(find sources/debian -name '*.dsc' -print -quit)"
          test -f share/firominer-gui/licenses/LGPL-3.0.txt
          # Check the relocated archive, with no build-kit search path overrides.
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QT_QPA_PLATFORM_PLUGIN_PATH
          find lib/firominer-gui -type f -exec ldd '{}' \; > gui-dependencies.txt
          ldd bin/firominer-gui >> gui-dependencies.txt
          if grep 'not found' gui-dependencies.txt; then exit 1; fi
          # Fail if any non-platform dependency falls back to a build-machine library.
          /usr/bin/cmake "-DPACKAGE_DIR=$PWD" -DVERIFY_ONLY=ON -P ../cmake/DeployLinuxGui.cmake
          QT_QPA_PLATFORM=offscreen ./bin/firominer-gui --version
          QT_QPA_PLATFORM=xcb QT_DEBUG_PLUGINS=1 xvfb-run -a ./bin/firominer-gui --version > gui-plugins.txt 2>&1
          grep -F "$PWD/lib/firominer-gui/plugins/platforms/libqxcb.so" gui-plugins.txt
          test -f share/firominer/patches/firo-coinbase-message.patch
          readelf -d bin/firominer | grep -F '$ORIGIN/../lib'
          ldd bin/firominer > dependencies.txt || true
          cat dependencies.txt
          # GPU-less runners lack libcuda.so.1, supplied by the user's NVIDIA driver.
          if grep 'not found' dependencies.txt | grep -v 'libcuda.so.1'; then exit 1; fi
          if [ '${{ matrix.cuda }}' = OFF ]; then
            if grep -E 'libcuda|libnvrtc' dependencies.txt; then exit 1; fi
            ./bin/firominer --version | tee version.txt
            grep -F 'Boost 1_92; JsonCpp 1.9.7; CLI11 2.6.2; OpenSSL 3.5.8' version.txt
            ./bin/firominer --help > help.txt
            grep -F -- '--cpu' help.txt
            ./bin/firominer --help-ext api | grep -F -- '--api-bind'
            ./bin/firominer --cpu --list-devices
          fi

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: firominer-linux-x86_64-${{ matrix.package }}.tar.gz
          if-no-files-found: error
          archive: false

      - name: Upload checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: firominer-linux-x86_64-${{ matrix.package }}.tar.gz.sha256
          if-no-files-found: error
          archive: false

  windows-build:
    name: Windows GUI and GPU backends
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      # Keep dependency builds on the same v142 toolset as the CUDA build.
      VS160COMNTOOLS: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install CUDA
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'cuda-12.9.2.exe'
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/12.9.2/network_installers/cuda_12.9.2_windows_x86_64_network.exe -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne 'DD7B10659DD38C4551E8E0A5EAEB607E9B642DD01F803C45F561D4D18B04D88C') {
            throw 'CUDA installer checksum mismatch'
          }
          $process = Start-Process $installer -ArgumentList '-s','-n','nvcc_12.9','cudart_12.9','nvrtc_12.9','nvrtc_dev_12.9' -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) {
            throw "CUDA installer failed with exit code $($process.ExitCode)"
          }
          $cuda = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9'
          if (!(Test-Path "$cuda\bin\nvcc.exe")) { throw 'nvcc missing after CUDA installation' }
          '@call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" %* -vcvars_ver=14.29' |
            Set-Content "$env:RUNNER_TEMP\vcvars142.bat" -Encoding ascii
          "CUDA_PATH=$cuda" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$cuda\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & "$cuda\bin\nvcc.exe" --version

      - name: Configure Windows builds
        shell: cmd
        run: |
          rem Build dependencies with the same v142 runtime used by firominer and CUDA.
          call "%RUNNER_TEMP%\vcvars142.bat" amd64 || exit /b 1
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v142 ^
            -DBUILD_TESTING=OFF ^
            -DAPICORE=ON ^
            -DETHASHCL=ON ^
            -DETHASHCUDA=ON ^
            -DETHASHCPU=ON ^
            -DETHDBUS=OFF ^
            -DHUNTER_JOBS_NUMBER=2 ^
            -DHUNTER_MSVC_VCVARSALL:FILEPATH="%RUNNER_TEMP%\vcvars142.bat" ^
            -DCUDA_USE_STATIC_CUDA_RUNTIME=OFF ^
            -DCUDA_TOOLKIT_ROOT_DIR="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9" || exit /b 1
          cmake -S . -B build-opencl -G "Visual Studio 17 2022" -A x64 -T v142 ^
            -DBUILD_TESTING=ON ^
            -DAPICORE=ON ^
            -DETHASHCL=ON ^
            -DETHASHCUDA=OFF ^
            -DETHASHCPU=ON ^
            -DETHDBUS=OFF ^
            -DHUNTER_JOBS_NUMBER=2 ^
            -DHUNTER_MSVC_VCVARSALL:FILEPATH="%RUNNER_TEMP%\vcvars142.bat" || exit /b 1

      - name: Install Qt build tools
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --archives qtbase qttools --outputdir "$env:RUNNER_TEMP/Qt"
          "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "QT_ROOT=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test GUI
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S gui -B build-gui -G "Visual Studio 17 2022" -A x64 -T v143 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT" -DBUILD_TESTING=ON
          cmake --build build-gui --config Release --parallel 2
          ctest --test-dir build-gui --build-config Release --output-on-failure

      - name: Prepare corresponding GUI source
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory gui-sources | Out-Null
          Copy-Item "$env:QT_ROOT/mkspecs/qconfig.pri" gui-sources/qt-build-config.pri
          git archive --format=tar.gz --output=gui-sources/firominer-source.tar.gz HEAD
          $qtSource = 'qtbase-everywhere-src-6.8.3.tar.xz'
          $qtSourceUrl = "https://download.qt.io/archive/qt/6.8/6.8.3/submodules/$qtSource"
          Invoke-WebRequest $qtSourceUrl -OutFile "gui-sources/$qtSource"
          $qtSourceHash = '56001b905601bb9023d399f3ba780d7fa940f3e4861e496a7c490331f49e0b80'
          if ((Get-FileHash "gui-sources/$qtSource" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $qtSourceHash) {
            throw 'Qt corresponding source checksum mismatch'
          }
          @(
            "Firominer GUI and miner commit: $(git rev-parse HEAD)"
            'Qt: 6.8.3, official win64_msvc2022_64 binaries; no local Qt modifications'
            'Qt feature/compiler configuration: qt-build-config.pri'
            "Qt corresponding source: $qtSource"
            "Upstream source: $qtSourceUrl"
            'Qt Core, Gui, Widgets, Network and the deployed Qt plugins are built from qtbase.'
            'The qtbase archive also contains its bundled third-party source and license notices.'
            'Keep these source archives with the package when redistributing it.'
          ) | Set-Content gui-sources/README.txt -Encoding utf8

      - name: Build
        shell: cmd
        run: |
          rem CUDA 12.9 and its dependencies must use the same v142 environment.
          call "%RUNNER_TEMP%\vcvars142.bat" amd64 || exit /b 1
          cmake --build build --config Release --target firominer --parallel 2 || exit /b 1
          cmake --build build-opencl --config Release --parallel 2 || exit /b 1

      - name: Test Release build
        run: ctest --test-dir build-opencl --build-config Release --output-on-failure --timeout 300

      - name: Package and verify
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --install build --config Release --prefix stage-cuda-opencl
          cmake --install build-opencl --config Release --prefix stage-opencl
          Copy-Item "$env:CUDA_PATH\bin\cudart64_*.dll" stage-cuda-opencl\bin -ErrorAction Stop
          Copy-Item "$env:CUDA_PATH\bin\nvrtc64_120_0.dll", "$env:CUDA_PATH\bin\nvrtc-builtins64_129.dll" stage-cuda-opencl\bin -ErrorAction Stop
          foreach ($variant in @('cuda-opencl', 'opencl')) {
            $stage = "stage-$variant"
            # Install after the v142 miner so the shared MSVC runtime also supports the v143 GUI.
            cmake --install build-gui --config Release --prefix $stage
            Copy-Item LICENSE, README.md $stage
            New-Item -ItemType Directory "$stage/docs" | Out-Null
            Copy-Item docs/TESTING.md, docs/API_DOCUMENTATION.md, docs/GUI.md "$stage/docs"
            Copy-Item gui-sources "$stage/sources" -Recurse
            foreach ($file in @('firominer.exe', 'firominer-gui.exe', 'mine_firo.bat', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Network.dll', 'platforms/qwindows.dll', 'imageformats/qico.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
              if (!(Test-Path "$stage/bin/$file")) { throw "$file missing from $stage" }
            }
            foreach ($library in Get-ChildItem "$stage/bin/Qt6*.dll") {
              if ($library.Name -notin @('Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Network.dll')) {
                throw "Unexpected Qt module $($library.Name): include its corresponding source before distributing"
              }
            }
            $cuda = if ($variant -eq 'cuda-opencl') { 'ON' } else { 'OFF' }
            @(
              "Source: https://github.com/$env:GITHUB_REPOSITORY/tree/$(git rev-parse HEAD)"
              "Source commit: ${{ github.event.pull_request.head.sha || github.sha }}"
              "Build: Release; CUDA=$cuda; OpenCL=ON; CPU=ON; API=ON; GUI=ON; DBUS=OFF"
              'Platform: Windows x86-64; miner: v142, CUDA toolkit 12.9.2; GUI: v143, Qt 6.8.3'
              "CI: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ) | Set-Content "$stage/BUILD-INFO.txt" -Encoding utf8
            Get-Content "$stage/share/firominer/dependencies.txt" | Add-Content "$stage/BUILD-INFO.txt" -Encoding utf8
            Push-Location $stage
            Get-ChildItem -File -Recurse | Where-Object Name -ne SHA256SUMS | Sort-Object FullName | ForEach-Object {
              $relative = (Resolve-Path -Relative $_.FullName).Replace('\', '/')
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $relative"
            } | Set-Content SHA256SUMS -Encoding utf8
            Pop-Location
          }
          7z a -tzip -mx=9 -mtc=off -mta=off -mtm=off firominer-windows-x86_64-cuda12.9-opencl.zip .\stage-cuda-opencl\*
          7z a -tzip -mx=9 -mtc=off -mta=off -mtm=off firominer-windows-x86_64-opencl.zip .\stage-opencl\*
          Get-ChildItem firominer-windows-*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS-windows.txt -Encoding utf8
          foreach ($archive in Get-ChildItem firominer-windows-*.zip) {
            $unpacked = Join-Path $env:RUNNER_TEMP $archive.BaseName
            Expand-Archive $archive.FullName $unpacked
            Push-Location $unpacked
            foreach ($line in Get-Content SHA256SUMS) {
              $expected, $path = $line -split '  ', 2
              if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne $expected) {
                throw "Checksum mismatch: $path"
              }
            }
            Pop-Location
          }
          # Use the extracted OpenCL-only package: CUDA executables import the driver DLL.
          $binary = Join-Path $env:RUNNER_TEMP 'firominer-windows-x86_64-opencl/bin/firominer.exe'
          # 41 accented characters are 82 UTF-8 bytes; catch Windows argv code-page loss.
          python -c "import subprocess; p = subprocess.run([r'$binary', '--list-devices', '--coinbase-message=' + chr(233)*41], capture_output=True, text=True, encoding='utf-8'); assert p.returncode != 0 and '80 UTF-8 bytes' in p.stdout+p.stderr"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES = '1'
          foreach ($variant in @('cuda12.9-opencl', 'opencl')) {
            $gui = Join-Path $env:RUNNER_TEMP "firominer-windows-x86_64-$variant/bin/firominer-gui.exe"
            $process = Start-Process -FilePath $gui -ArgumentList '--version' -WindowStyle Hidden -PassThru
            if (!$process.WaitForExit(10000)) {
              $process.Kill()
              throw "Packaged GUI did not exit after --version: $variant"
            }
            if ($process.ExitCode -ne 0) { throw "Packaged GUI exited with $($process.ExitCode): $variant" }
          }
          $version = & $binary --version | Out-String
          Write-Output $version
          if (!$version.Contains('Boost 1_92; JsonCpp 1.9.7; CLI11 2.6.2; OpenSSL 3.5.8')) {
            throw 'Packaged dependency versions do not match the release pins'
          }
          $help = & $binary --help | Out-String
          if (!$help.Contains('--cpu')) { throw 'CPU diagnostics missing from help' }
          $apiHelp = & $binary --help-ext api | Out-String
          if (!$apiHelp.Contains('--api-bind')) { throw 'API missing from help' }
          & $binary --cpu --list-devices

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: firominer-windows-x86_64-cuda12.9-opencl.zip
          if-no-files-found: error
          archive: false

      - name: Upload OpenCL binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: firominer-windows-x86_64-opencl.zip
          if-no-files-found: error
          archive: false

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: SHA256SUMS-windows.txt
          if-no-files-found: error
          archive: false

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [test, gpu-build, windows-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^set\(PROJECT_VERSION[[:space:]]+([^ )]+)\)$/\1/p' CMakeLists.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid PROJECT_VERSION: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match PROJECT_VERSION $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: firominer-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Download Windows checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SHA256SUMS-windows.txt
          path: release-assets

      - name: Verify release assets
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          assets=(
            firominer-linux-x86_64-cuda12.9-opencl.tar.gz
            firominer-linux-x86_64-cuda12.9-opencl.tar.gz.sha256
            firominer-linux-x86_64-opencl.tar.gz
            firominer-linux-x86_64-opencl.tar.gz.sha256
            firominer-windows-x86_64-cuda12.9-opencl.zip
            firominer-windows-x86_64-opencl.zip
            SHA256SUMS-windows.txt
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#assets[@]}"
          sha256sum --check firominer-linux-x86_64-cuda12.9-opencl.tar.gz.sha256
          sha256sum --check firominer-linux-x86_64-opencl.tar.gz.sha256
          sed -i 's/\r$//' SHA256SUMS-windows.txt
          sha256sum --check SHA256SUMS-windows.txt
          for package in firominer-windows-*.zip; do
            for entry in bin/firominer.exe bin/firominer-gui.exe docs/GUI.md sources/firominer-source.tar.gz sources/qtbase-everywhere-src-6.8.3.tar.xz share/firominer-gui/licenses/LGPL-3.0.txt; do
              unzip -Z1 "$package" | grep -Fx "$entry"
            done
          done
          for package in firominer-linux-*.tar.gz; do
            tar -tzf "$package" > linux-contents.txt
            for entry in bin/firominer bin/firominer-gui bin/qt.conf docs/GUI.md lib/firominer-gui/plugins/platforms/libqxcb.so sources/firominer-source.tar.gz share/firominer-gui/licenses/LGPL-3.0.txt; do
              grep -Fx "./$entry" linux-contents.txt
            done
            grep -E '^\./sources/debian/[^/]+\.dsc$' linux-contents.txt
          done
          rm linux-contents.txt
          cat firominer-linux-*.tar.gz.sha256 SHA256SUMS-windows.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish release
        shell: bash
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            firominer-linux-x86_64-cuda12.9-opencl.tar.gz
            firominer-linux-x86_64-cuda12.9-opencl.tar.gz.sha256
            firominer-linux-x86_64-opencl.tar.gz
            firominer-linux-x86_64-opencl.tar.gz.sha256
            firominer-windows-x86_64-cuda12.9-opencl.zip
            firominer-windows-x86_64-opencl.zip
          )
          options=(--verify-tag --notes-file ../RELEASE_NOTES.md --title "Firominer $GITHUB_REF_NAME")
          assets+=(SHA256SUMS.txt)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${options[@]}"
